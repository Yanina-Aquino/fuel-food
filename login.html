<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · füel.</title>
<meta name="description" content="Gestioná tus viandas y tu suscripción.">
<meta property="og:title" content="Ingresar · füel.">
<meta property="og:image" content="https://fuel-food.netlify.app/img/hero-caja.jpg">
<meta name="theme-color" content="#FBF9F6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body data-page="login">
<div id="site-header"></div>
<main class="auth">
  <div class="auth__visual" style="background-image:url('img/login-bg.jpg')"><h2>La forma más simple de comer bien todos los días.</h2></div>
  <div class="auth__form">
    <form class="auth__box" id="form">
      <div style="display:flex; flex-direction:column; gap:10px"><h1 style="font-size:36px; letter-spacing:-.03em">Ingresá a tu panel</h1><p class="muted">Gestioná tus viandas y tu suscripción.</p></div>
      <p class="form-msg form-msg--error" id="msg" role="alert" hidden></p>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" data-rules="required email" autocomplete="email" placeholder="tu@mail.com"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" data-rules="required" autocomplete="current-password"></div>
      <a href="recuperar.html" style="align-self:flex-end; margin-top:-12px; font-size:14px; font-weight:500; color:var(--fuel-olive)">¿Olvidaste tu contraseña?</a>
      <button type="submit" class="btn btn--primary btn--lg" style="width:100%">Ingresar</button>
      <p class="muted" style="text-align:center; font-size:15px">¿No tenés cuenta? <a href="registro.html" style="color:var(--fuel-olive); font-weight:600">Creala acá</a></p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/motion.js"></script>
<script src="js/forms.js"></script>
<script>
if (Store.get('user')) location.replace('panel.html');
const form = document.getElementById('form'), msg = document.getElementById('msg');
Forms.bind(form, d => {
  const acc = (Store.get('accounts') || {})[d.email.trim().toLowerCase()];
  if (!acc || acc.password !== d.password) { msg.hidden = false; msg.textContent = 'El email o la contraseña no coinciden. Revisalos o creá una cuenta.'; return; }
  Store.set('user', acc.user); location.href = 'panel.html';
});
</script>
</body>
</html>
